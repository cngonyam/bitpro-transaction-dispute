spring:
  datasource:
    url: ${APP_DB_URL:jdbc:postgresql://localhost:5432/transaction_dispute}
    username: ${APP_DB_USERNAME:dispute}
    password: ${APP_DB_PASSWORD:dispute}
    driver-class-name: org.postgresql.Driver
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
