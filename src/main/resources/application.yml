spring:
  application:
    name: transaction-dispute-api
  datasource:
    url: jdbc:sqlite:${APP_DB_PATH:transaction-dispute.db}?date_class=TEXT&date_string_format=yyyy-MM-dd HH:mm:ss
    username: ${APP_DB_USERNAME:}
    password: ${APP_DB_PASSWORD:}
    driver-class-name: org.sqlite.JDBC
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.community.dialect.SQLiteDialect
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true
    drop-first: false

app:
  security:
    username: ${APP_SECURITY_USERNAME:}
    password: ${APP_SECURITY_PASSWORD:}
  account-mappings: ${APP_ACCOUNT_MAPPINGS:admin-user=ACC-1001,agent-user=ACC-1001,lead-user=ACC-1001,customer-user=ACC-1001}

server:
  port: ${SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html


