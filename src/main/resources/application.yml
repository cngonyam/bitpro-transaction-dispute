spring:
  application:
    name: transaction-dispute-api
  datasource:
    url: jdbc:sqlite:transaction-dispute.db
    username: ""
    password: ""
    driver-class-name: org.sqlite.JDBC
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.community.dialect.SQLiteDialect
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true
    drop-first: true
  security:
    user:
      name: dev-user
      password: dev-pass123
      roles: ADMIN

app:
  dev:
    username: dev-user
    password: dev-pass123
    account-number: ACC-1001

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html