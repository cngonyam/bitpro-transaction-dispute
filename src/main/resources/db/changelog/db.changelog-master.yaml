# Master changelog. Each included file keeps logicalFilePath = this file, so changeSet identity
# (id + author + path) stays identical to the previous single-file layout and existing databases do not re-run anything.
# Append new changeSets in a new numbered file under changes/ and include it below.
databaseChangeLog:
  - include:
      file: db/changelog/changes/001-core-schema.yaml
  - include:
      file: db/changelog/changes/002-seed-data.yaml
  - include:
      file: db/changelog/changes/003-optimistic-locking.yaml
  - include:
      file: db/changelog/changes/004-status-history-and-uniqueness.yaml
  - include:
      file: db/changelog/changes/005-role-normalization.yaml
  - include:
      file: db/changelog/changes/006-reversal-and-ledger.yaml
  - include:
      file: db/changelog/changes/007-append-only-audit.yaml
