databaseChangeLog:
  - changeSet:
      id: 001-create-accounts-table
      author: Ndumiso Ngonyama
      changes:
        - createTable:
            tableName: accounts
            columns:
              - column:
                  name: id
                  type: INTEGER
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: account_number
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: customer_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: currency
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: available_balance
                  type: DECIMAL(38,2)
                  constraints:
                    nullable: false
              - column:
                  name: balance
                  type: DECIMAL(38,2)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

