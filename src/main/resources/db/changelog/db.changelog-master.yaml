      author: Ndumiso Ngonyama
      changes:
        - update:
            tableName: accounts
            columns:
              - column:
                  name: version
                  valueNumeric: 0
            where: version IS NULL
        - update:
            tableName: transactions
            columns:
              - column:
                  name: version
                  valueNumeric: 0
            where: version IS NULL

  - changeSet:
      id: 011-add-dispute-version-column
      author: Ndumiso Ngonyama
      changes:
