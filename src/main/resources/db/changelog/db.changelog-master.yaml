                  constraints:
                    nullable: false
              - column:
                  name: actor
                  type: VARCHAR(255)
              - column:
                  name: actor_role
                  type: VARCHAR(255)
              - column:
                  name: description
                  type: VARCHAR(1000)
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_dispute_ledger_entries_dispute_id
            tableName: dispute_ledger_entries
            columns:
              - column:
                  name: dispute_id
        - createIndex:
            indexName: idx_dispute_ledger_entries_account_reference
            tableName: dispute_ledger_entries
            columns:
              - column:
                  name: account_number
              - column:
                  name: transaction_reference

