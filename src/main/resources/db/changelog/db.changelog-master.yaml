                    nullable: false
        - update:
            tableName: disputes
            columns:
              - column:
                  name: version
                  valueNumeric: 0
            where: version IS NULL

  - changeSet:
      id: 012-create-dispute-status-history-table
      author: Ndumiso Ngonyama
      changes:
        - createTable:
            tableName: dispute_status_history
            columns:
              - column:
                  name: id
                  type: INTEGER
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: dispute_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: from_status
                  type: VARCHAR(255)
              - column:
                  name: to_status
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: action
                  type: VARCHAR(255)
              - column:
                  name: reason_code
                  type: VARCHAR(255)
              - column:
                  name: actor
                  type: VARCHAR(255)
              - column:
                  name: actor_role
                  type: VARCHAR(255)
              - column:
                  name: changed_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_dispute_status_history_dispute_id
            tableName: dispute_status_history
            columns:
              - column:
                  name: dispute_id
        - createIndex:
            indexName: idx_dispute_status_history_changed_at
            tableName: dispute_status_history
            columns:
              - column:
                  name: changed_at

  - changeSet:
      id: 013-ensure-transaction-and-dispute-reference-uniqueness
      author: Ndumiso Ngonyama
      validCheckSum: 9:24cda71a3cc59714d9183fb66c73bfc8
      changes:
        - createIndex:
            indexName: idx_transactions_transaction_reference_unique
            tableName: transactions
            unique: true
            columns:
              - column:
                  name: transaction_reference
        - createIndex:
            indexName: idx_disputes_transaction_reference_unique
            tableName: disputes
            unique: true
            columns:
              - column:
                  name: transaction_reference

  - changeSet:
      id: 014-canonicalize-legacy-user-roles
      author: Ndumiso Ngonyama
      changes:
        - update:
            tableName: user_profiles
            columns:
              - column:
                  name: role
                  value: AGENT
            where: upper(role) LIKE '%AGENT%' OR upper(role) LIKE '%LEAD%' OR upper(role) LIKE '%OPERATIONS%'
        - update:
            tableName: user_profiles
            columns:
              - column:
                  name: role
                  value: ADMIN
            where: upper(role) LIKE '%ADMIN%'
        - update:
            tableName: user_profiles
            columns:
              - column:
                  name: role
                  value: CUSTOMER
            where: role IS NULL OR trim(role) = ''
        - update:
            tableName: dispute_status_history
            columns:
              - column:
                  name: actor_role
                  value: AGENT
            where: actor IS NOT NULL AND (upper(actor) LIKE '%AGENT%' OR upper(actor) LIKE '%LEAD%' OR upper(actor) LIKE '%OPERATIONS%') AND actor_role IS NULL
        - update:
            tableName: dispute_status_history
            columns:
              - column:
                  name: actor_role
                  value: ADMIN
            where: actor IS NOT NULL AND upper(actor) LIKE '%ADMIN%' AND actor_role IS NULL
        - update:
            tableName: dispute_status_history
            columns:
              - column:
                  name: actor_role
                  value: CUSTOMER
            where: actor IS NOT NULL AND actor_role IS NULL

  - changeSet:
