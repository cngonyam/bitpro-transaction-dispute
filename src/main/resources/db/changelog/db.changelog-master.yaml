databaseChangeLog:
  - changeSet:
      id: 001-create-accounts-table
      author: Ndumiso Ngonyama
      changes:
        - createTable:
            tableName: accounts
            columns:
              - column:
                  name: id
                  type: INTEGER
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: account_number
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: customer_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: currency
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: available_balance
                  type: DECIMAL(38,2)
                  constraints:
                    nullable: false
              - column:
                  name: balance
                  type: DECIMAL(38,2)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

  - changeSet:
      id: 002-create-transactions-table
      author: Ndumiso Ngonyama
      changes:
        - createTable:
            tableName: transactions
            columns:
              - column:
                  name: id
                  type: INTEGER
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: transaction_reference
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: account_number
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: amount
                  type: DECIMAL(38,2)
                  constraints:
                    nullable: false
              - column:
                  name: currency
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: merchant_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: transaction_date
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(500)

  - changeSet:
      id: 003-create-disputes-table
      author: Ndumiso Ngonyama
      changes:
        - createTable:
            tableName: disputes
            columns:
              - column:
                  name: id
                  type: INTEGER
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: dispute_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: transaction_reference
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: account_number
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: disputed_amount
                  type: DECIMAL(38,2)
                  constraints:
                    nullable: false
              - column:
                  name: reason_code
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: dispute_type
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: assigned_to_full_name
                  type: VARCHAR(255)
              - column:
                  name: provisional_credit_issued
                  type: BOOLEAN
              - column:
                  name: merchant_evidence_provided
                  type: BOOLEAN
              - column:
                  name: decision_outcome
                  type: VARCHAR(255)
              - column:
                  name: status
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

  - changeSet:
      id: 004-create-user-profiles-table
      author: Ndumiso Ngonyama
      changes:
        - createTable:
            tableName: user_profiles
            columns:
              - column:
                  name: id
                  type: INTEGER
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: username
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: full_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: VARCHAR(255)
              - column:
                  name: email
                  type: VARCHAR(255)
              - column:
                  name: phone
                  type: VARCHAR(255)
              - column:
                  name: department
                  type: VARCHAR(255)
              - column:
                  name: region
                  type: VARCHAR(255)

  - changeSet:
      id: 005-insert-account-data
      author: Ndumiso Ngonyama
      changes:
        - insert:
            tableName: accounts
            columns:
              - column:
                  name: account_number
                  value: ACC-1001
              - column:
                  name: customer_name
                  value: Jane Smith
              - column:
                  name: currency
                  value: ZAR
              - column:
                  name: available_balance
                  valueNumeric: 0.0
              - column:
                  name: balance
                  valueNumeric: 0.0
              - column:
                  name: status
                  value: ACTIVE

