# Append-only audit tables: SQLite (018) and PostgreSQL (019)
databaseChangeLog:
  - logicalFilePath: db/changelog/db.changelog-master.yaml

  - changeSet:
      id: 018-make-audit-tables-append-only
      author: Ndumiso Ngonyama
      dbms: sqlite
      changes:
        - sql:
            splitStatements: false
            sql: >
              CREATE TRIGGER trg_dispute_status_history_no_update BEFORE UPDATE ON dispute_status_history
              BEGIN SELECT RAISE(ABORT, 'dispute_status_history is append-only'); END;
        - sql:
            splitStatements: false
            sql: >
              CREATE TRIGGER trg_dispute_status_history_no_delete BEFORE DELETE ON dispute_status_history
              BEGIN SELECT RAISE(ABORT, 'dispute_status_history is append-only'); END;
        - sql:
            splitStatements: false
            sql: >
              CREATE TRIGGER trg_dispute_ledger_entries_no_update BEFORE UPDATE ON dispute_ledger_entries
              BEGIN SELECT RAISE(ABORT, 'dispute_ledger_entries is append-only'); END;
        - sql:
            splitStatements: false
            sql: >
              CREATE TRIGGER trg_dispute_ledger_entries_no_delete BEFORE DELETE ON dispute_ledger_entries
              BEGIN SELECT RAISE(ABORT, 'dispute_ledger_entries is append-only'); END;

  - changeSet:
      id: 019-make-audit-tables-append-only-postgres
      author: Ndumiso Ngonyama
      dbms: postgresql
      changes:
        - sql:
            splitStatements: false
            sql: >
              CREATE FUNCTION reject_audit_mutation() RETURNS trigger AS $$
              BEGIN RAISE EXCEPTION '% is append-only', TG_TABLE_NAME; END;
              $$ LANGUAGE plpgsql
        - sql:
            sql: >
              CREATE TRIGGER trg_dispute_status_history_append_only BEFORE UPDATE OR DELETE ON dispute_status_history
              FOR EACH ROW EXECUTE FUNCTION reject_audit_mutation()
        - sql:
            sql: >
              CREATE TRIGGER trg_dispute_ledger_entries_append_only BEFORE UPDATE OR DELETE ON dispute_ledger_entries
              FOR EACH ROW EXECUTE FUNCTION reject_audit_mutation()
