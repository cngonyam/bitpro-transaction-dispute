# Seed data: demo account and transactions (007-008)
databaseChangeLog:
  - logicalFilePath: db/changelog/db.changelog-master.yaml

  - changeSet:
      id: 007-insert-account-data
      author: Ndumiso Ngonyama
      changes:
        - insert:
            tableName: accounts
            columns:
              - column:
                  name: account_number
                  value: ACC-1001
              - column:
                  name: customer_name
                  value: Jane Smith
              - column:
                  name: currency
                  value: ZAR
              - column:
                  name: available_balance
                  valueNumeric: 0.0
              - column:
                  name: balance
                  valueNumeric: 0.0
              - column:
                  name: status
                  value: ACTIVE

  - changeSet:
