                  value: ACC-1001
              - column:
                  name: amount
                  valueNumeric: 12000.00
              - column:
                  name: currency
                  value: ZAR
              - column:
                  name: type
                  value: CREDIT
              - column:
                  name: merchant_name
                  value: Employer Payroll
              - column:
                  name: status
                  value: SETTLED
              - column:
                  name: transaction_date
                  value: 2026-10-01T00:00:00
              - column:
