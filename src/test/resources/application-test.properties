spring.datasource.url=jdbc:sqlite:file:testdb?mode=memory&cache=shared&date_class=TEXT&date_string_format=yyyy-MM-dd HH:mm:ss
spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=org.sqlite.JDBC

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.enabled=true

spring.security.user.name=admin
spring.security.user.password=admin123

app.security.username=agent-user
app.security.password=agent-pass123
app.account-mappings=admin-user=ACC-1001,agent-user=ACC-1001,lead-user=ACC-1001,customer-user=ACC-1001


app.security.demo-users-enabled=true
jwt.secret=test-only-jwt-secret-for-unit-tests-0123456789
