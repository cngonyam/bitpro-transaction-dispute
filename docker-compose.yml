services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dispute-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:sqlite:/data/transaction-dispute.db
    volumes:
      - sqlite-data:/data
    ports:
      - "8082:8082"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dispute-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  sqlite-data:
