services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dispute-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:sqlite:/data/transaction-dispute.db
    volumes:
      - sqlite-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    ports:
      - "8082:8082"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dispute-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  sqlite-data:
